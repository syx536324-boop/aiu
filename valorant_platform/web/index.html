<!-- VALORANT local platform shell: mounts the chat, roster, and agent detail views. -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0f" />
    <meta name="description" content="AIU VALORANT 特工资料库、技能介绍与地图导航" />
    <title>AIU // VALORANT INTEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-red" aria-hidden="true"></div>
    <div class="ambient ambient-cyan" aria-hidden="true"></div>
    <div class="app-frame">
      <aside class="sidebar">
        <a class="brand" href="#/" aria-label="AIU VALORANT 首页">
          <span class="brand-mark"><i></i><b></b></span>
          <span class="brand-copy"><strong>AIU<span>//</span>VALORANT</strong><small>TACTICAL INTELLIGENCE</small></span>
        </a>
        <div class="side-label">指挥台</div>
        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-link active" data-view="home"><span class="nav-icon">⌘</span><span>智能问答</span><kbd>01</kbd></button>
          <button class="nav-link" data-view="library"><span class="nav-icon">▦</span><span>特工资料库</span><kbd>29</kbd></button>
        </nav>
        <div class="side-rule"></div>
        <div class="side-label">快速筛选</div>
        <div class="role-nav">
          <button data-role-filter="决斗"><span class="role-dot duel"></span>决斗<span class="role-count">8</span></button>
          <button data-role-filter="先锋"><span class="role-dot initiator"></span>先锋<span class="role-count">7</span></button>
          <button data-role-filter="控场"><span class="role-dot controller"></span>控场<span class="role-count">7</span></button>
          <button data-role-filter="哨卫"><span class="role-dot sentinel"></span>哨卫<span class="role-count">7</span></button>
        </div>
        <div class="sidebar-bottom">
          <div class="connection-card">
            <span class="online-dot"></span>
            <div><strong>本地节点在线</strong><small>QWEN 3.5 · DIFY API</small></div>
            <span class="connection-pulse"></span>
          </div>
          <div class="profile-line"><div class="profile-avatar">AIU</div><div><strong>战术分析员</strong><small>LOCAL OPERATOR</small></div><span class="more">•••</span></div>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="breadcrumbs"><span>AIU INTELLIGENCE</span><b>/</b><strong id="crumb-current">作战终端</strong></div>
          <div class="topbar-right"><span class="build-tag"><i></i> LOCAL BUILD 01</span><button class="icon-button" id="new-chat" title="开启新对话" aria-label="开启新对话">＋</button><div class="top-avatar">A</div></div>
        </header>
        <div id="view-root" class="view-root"></div>
        <footer class="statusbar"><span><i class="online-dot"></i> SYSTEM READY</span><span>ROSTER SYNC <b>RIOT GAMES</b></span><span>AIU // TACTICAL INTEL <b>0.1.0</b></span></footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
